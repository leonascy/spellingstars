<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#faf9f7;color:#1a1a1a;min-height:100vh;}
.app{max-width:620px;margin:0 auto;padding:1.2rem 1rem 3rem;}
h1{font-size:22px;font-weight:700;text-align:center;color:#2d2060;margin-bottom:3px;}
.sub{text-align:center;font-size:13px;color:#999;margin-bottom:1.2rem;}
.trophy-screen{background:#fff;border-radius:16px;border:1px solid #ebe9f8;padding:1.4rem;margin-bottom:1rem;}
.trophy-screen h2{font-size:16px;font-weight:700;color:#2d2060;margin-bottom:4px;}
.tsub{font-size:12px;color:#aaa;margin-bottom:1.2rem;}
.weeks-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.2rem;}
.week-card{background:#f7f6ff;border-radius:12px;border:1px solid #e5e3f5;padding:10px 6px;text-align:center;cursor:default;transition:all .15s;}
.week-card.has-words{cursor:pointer;}
.week-card.has-words:hover{border-color:#c5c1f0;}
.week-card.perfect{background:#fffbf0;border-color:#f5d060;}
.week-card.active{border:2px solid #7F77DD;background:#eeedfe;}
.wk-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.wk-stars{font-size:16px;line-height:1;margin-bottom:4px;min-height:20px;}
.wk-score{font-size:11px;color:#888;}
.start-btn{width:100%;padding:11px;border-radius:10px;border:none;background:#534AB7;color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.start-btn:hover{background:#3C3489;}
.pips{display:flex;gap:4px;justify-content:center;margin-bottom:1.2rem;}
.pip{height:7px;flex:1;max-width:50px;border-radius:4px;background:#e5e3f5;}
.pip.done{background:#5DCAA5;}.pip.cur{background:#7F77DD;}
.card{background:#fff;border-radius:16px;border:1px solid #ebe9f8;padding:1.4rem;margin-bottom:.8rem;}
.wnum{font-size:11px;color:#bbb;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;}
.tabs{display:flex;gap:6px;margin-bottom:1.1rem;}
.tab{flex:1;padding:7px 0;border-radius:8px;font-size:13px;font-weight:600;border:1px solid #e0ddf5;cursor:pointer;background:#fff;color:#aaa;text-align:center;transition:all .15s;}
.tab.on{background:#eeedfe;color:#534AB7;border-color:#c5c1f0;}
.sent-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:#f7f6ff;border-radius:10px;margin-bottom:1rem;}
.sent-text{font-size:15px;line-height:1.7;color:#222;flex:1;}
.sent-text .tw{font-weight:800;text-decoration:underline;color:#2d2060;text-underline-offset:3px;}
.sent-text .blank{display:inline-block;min-width:60px;border-bottom:2px solid #7F77DD;vertical-align:bottom;margin:0 2px;}
.spk{background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#7F77DD;flex-shrink:0;transition:background .15s;}
.spk:hover{background:#eeedfe;}
.spk svg{width:20px;height:20px;}
.mean{font-size:13px;color:#555;padding:8px 12px;border-left:3px solid #5DCAA5;border-radius:0 8px 8px 0;background:#f0faf6;margin-bottom:1.1rem;}
.mean b{color:#1a1a1a;}
.plabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#bbb;margin-bottom:8px;}
.ph-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1.1rem;}
.ph{padding:8px 13px;border-radius:10px;font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;min-width:46px;}
.ph .ipa{font-size:10px;font-weight:400;margin-top:3px;opacity:.65;font-family:monospace;}
.ph .ptype{font-size:9px;margin-top:1px;opacity:.5;text-transform:uppercase;letter-spacing:.04em;}
.ph.v{background:#eeedfe;color:#3C3489;}
.ph.c{background:#e1f5ee;color:#085041;}
.ph.b{background:#faece7;color:#712B13;}
.ph.d{background:#faeeda;color:#633806;}
.ph.s{background:#f1efe8;color:#aaa;}
.tip{font-size:13px;color:#666;padding:9px 12px;background:#fafaf5;border-radius:8px;margin-bottom:1.1rem;line-height:1.5;}
.leg{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:1.1rem;}
.li{display:flex;align-items:center;gap:4px;font-size:11px;color:#aaa;}
.ld{width:9px;height:9px;border-radius:2px;}
.spell-action-btn{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid #e0ddf5;background:#fff;cursor:pointer;width:100%;text-align:left;transition:background .15s;margin-bottom:1.1rem;}
.spell-action-btn:hover{background:#f0eeff;}
.spk-circle{width:34px;height:34px;border-radius:50%;background:#eeedfe;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.spk-circle svg{width:18px;height:18px;color:#534AB7;}
.btn-label{font-size:13px;font-weight:600;color:#333;}
.btn-sub{font-size:12px;color:#aaa;margin-top:1px;}
.spell-input{font-size:22px;padding:10px 14px;width:100%;border-radius:10px;border:1.5px solid #ddd;background:#fff;color:#222;margin-bottom:12px;outline:none;transition:border-color .2s;direction:ltr;text-align:left;}
.spell-input:focus{border-color:#7F77DD;}
.spell-input.correct{border-color:#1D9E75;background:#f0faf6;}
.spell-input.wrong{border-color:#D85A30;background:#fff5f3;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
button.act{font-size:13px;padding:9px 18px;border-radius:9px;border:1px solid #ddd;background:#fff;color:#333;cursor:pointer;font-weight:500;}
button.act:hover{background:#f5f5f5;}
button.pri{background:#534AB7;color:#fff;border-color:#534AB7;}
button.pri:hover{background:#3C3489;}
button.suc{background:#1D9E75;color:#fff;border-color:#1D9E75;}
button.warn{background:#D85A30;color:#fff;border-color:#D85A30;}
.fb{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:14px;line-height:1.5;}
.fb.good{background:#e1f5ee;color:#085041;}
.fb.bad{background:#faece7;color:#712B13;}
.test-card{background:#fff;border-radius:16px;border:1px solid #ebe9f8;padding:1.4rem;margin-bottom:1rem;}
.test-title{font-size:16px;font-weight:700;color:#2d2060;margin-bottom:4px;}
.test-sub{font-size:12px;color:#aaa;margin-bottom:1.2rem;}
.test-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0eeff;}
.test-row:last-of-type{border-bottom:none;}
.test-num{font-size:13px;font-weight:700;color:#bbb;min-width:20px;}
.test-spk{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:6px;color:#7F77DD;display:flex;align-items:center;flex-shrink:0;}
.test-spk:hover{background:#eeedfe;}
.test-spk.playing{color:#534AB7;background:#eeedfe;}
.test-spk svg{width:20px;height:20px;}
.test-input{font-size:16px;padding:7px 11px;flex:1;border-radius:8px;border:1.5px solid #ddd;background:#fff;color:#222;outline:none;direction:ltr;text-align:left;transition:border-color .2s;}
.test-input:focus{border-color:#7F77DD;}
.test-input.t-ok{border-color:#1D9E75;background:#f0faf6;color:#085041;}
.test-input.t-bad{border-color:#D85A30;background:#fff5f3;color:#993C1D;}
.test-correct-ans{font-size:11px;color:#D85A30;font-weight:700;min-width:90px;text-align:right;}
.test-actions{display:flex;gap:8px;margin-top:1.2rem;flex-wrap:wrap;}
.sc{text-align:center;padding:1.5rem 1rem;}
.sc-stars{font-size:26px;letter-spacing:1px;margin-bottom:.6rem;}
.sc-num{font-size:48px;font-weight:700;color:#534AB7;line-height:1;}
.sc h2{font-size:20px;font-weight:700;margin:.6rem 0 .3rem;}
.sc p{color:#777;margin-bottom:.6rem;font-size:14px;}
.choc-box{background:#fffbf0;border:2px solid #f5c842;border-radius:12px;padding:1rem;margin:1rem 0;font-size:15px;color:#7a5c00;font-weight:600;}
.choc-icon{font-size:42px;margin-bottom:.4rem;}
.sc-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:1rem;}
@keyframes pop{0%{transform:scale(0.6);opacity:0;}70%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
.pop{animation:pop .35s ease forwards;}
</style>
</head>
<body>
<div class="app">
  <h1>Spelling Stars ⭐</h1>
  <p class="sub">Term 3 — Learn, listen and spell!</p>
  <div id="root"></div>
</div>
<script>
const WEEKS=[
 {week:3,words:[
  {word:"toys",target:"toys",sentence:"David took out all his toys from the cupboard.",meaning:"Objects that children play with.",phonemes:[{p:"t",t:"c",ipa:"/t/"},{p:"oy",t:"d",ipa:"/ɔɪ/ oy"},{p:"s",t:"c",ipa:"/z/"}],hint:"'oy' makes the oy sound — like in boy and joy."},
  {word:"soap",target:"soap",sentence:"We should wash our hands with soap and water frequently.",meaning:"A substance used with water for washing and cleaning.",phonemes:[{p:"s",t:"c",ipa:"/s/"},{p:"oa",t:"d",ipa:"/əʊ/ oh"},{p:"p",t:"c",ipa:"/p/"}],hint:"'oa' makes a long oh sound — like in boat and road."},
  {word:"mittens",target:"mittens",sentence:"My baby brother wears his mittens at night.",meaning:"Gloves that cover the fingers together, keeping hands warm.",phonemes:[{p:"m",t:"c",ipa:"/m/"},{p:"i",t:"v",ipa:"/ɪ/ ih"},{p:"tt",t:"c",ipa:"/t/"},{p:"en",t:"d",ipa:"/ən/"},{p:"s",t:"c",ipa:"/z/"}],hint:"Double 'tt' gives a short vowel before it. 'en' sounds like un at the end."},
  {word:"blanket",target:"blanket",sentence:"Cover yourself with a blanket so that you will not catch a cold.",meaning:"A warm covering used in bed or to keep you warm.",phonemes:[{p:"bl",t:"b",ipa:"/bl/"},{p:"a",t:"v",ipa:"/æ/ a"},{p:"nk",t:"d",ipa:"/ŋk/"},{p:"et",t:"d",ipa:"/ɪt/"}],hint:"'bl' is a blend. 'nk' makes a nk sound — like in drink."},
  {word:"pacifier",target:"pacifier",sentence:"My baby sister threw her pacifier on the floor.",meaning:"A rubber teat given to a baby to suck on to keep it calm.",phonemes:[{p:"p",t:"c",ipa:"/p/"},{p:"a",t:"v",ipa:"/æ/ a"},{p:"c",t:"c",ipa:"/s/"},{p:"i",t:"v",ipa:"/aɪ/ eye"},{p:"f",t:"c",ipa:"/f/"},{p:"ier",t:"d",ipa:"/ɪər/ eer"}],hint:"'c' before 'i' says s. 'i' says eye — magic e pattern. Say: pa·ci·fi·er."},
  {word:"family",target:"family",sentence:"My family likes durians. We eat them on weekends.",meaning:"A group of people related to each other, like parents and children.",phonemes:[{p:"f",t:"c",ipa:"/f/"},{p:"a",t:"v",ipa:"/æ/ a"},{p:"m",t:"c",ipa:"/m/"},{p:"i",t:"v",ipa:"/ɪ/ ih"},{p:"ly",t:"d",ipa:"/liː/ lee"}],hint:"'ly' at the end sounds like lee. Say it in parts: fam·i·ly."},
  {word:"baking",target:"baking",sentence:"Aunt Mary enjoys baking chocolates cupcakes for her children.",meaning:"Cooking food in an oven using dry heat.",phonemes:[{p:"b",t:"c",ipa:"/b/"},{p:"a",t:"v",ipa:"/eɪ/ ay"},{p:"k",t:"c",ipa:"/k/"},{p:"ing",t:"d",ipa:"/ɪŋ/"}],hint:"'a' says ay — the magic e in bake is dropped when adding 'ing'. Bake → baking."},
  {word:"smiled",target:"smiled",sentence:"Joash smiled at his mother when she carried him in her arms.",meaning:"Made a happy expression by turning the corners of the mouth upward.",phonemes:[{p:"sm",t:"b",ipa:"/sm/"},{p:"i",t:"v",ipa:"/aɪ/ eye"},{p:"l",t:"c",ipa:"/l/"},{p:"ed",t:"d",ipa:"/d/ past"}],hint:"'sm' is a blend. 'i' says eye — magic e rule. Smile → smiled, dropping the 'e'."},
  {word:"wiped",target:"wiped",sentence:"Siti wiped the table with a piece of cloth after she had finished her meal.",meaning:"Cleaned or dried a surface by rubbing it.",phonemes:[{p:"w",t:"c",ipa:"/w/"},{p:"i",t:"v",ipa:"/aɪ/ eye"},{p:"p",t:"c",ipa:"/p/"},{p:"ed",t:"d",ipa:"/t/ past"}],hint:"'i' says eye — magic e rule. Wipe → wiped, dropping the 'e'. 'ed' sounds like t here."},
  {word:"played",target:"played",sentence:"We played some interesting games during PE lesson.",meaning:"Took part in a game or activity for fun.",phonemes:[{p:"pl",t:"b",ipa:"/pl/"},{p:"ay",t:"d",ipa:"/eɪ/ ay"},{p:"ed",t:"d",ipa:"/d/ past"}],hint:"'pl' is a blend. 'ay' says ay. 'ed' adds a d sound at the end. Play → played."},
 ]},
 {week:4,words:[
  {word:"cry",target:"cry",sentence:"John and his brother cry when their father scold them.",meaning:"To shed tears, usually because of sadness or pain.",phonemes:[{p:"cr",t:"b",ipa:"/kr/"},{p:"y",t:"v",ipa:"/aɪ/ eye"}],hint:"'cr' is a blend. 'y' at the end says eye — like in try and fly."},
  {word:"baby",target:"baby",sentence:"The baby is drinking milk.",meaning:"A very young child who cannot yet walk or talk.",phonemes:[{p:"b",t:"c",ipa:"/b/"},{p:"a",t:"v",ipa:"/eɪ/ ay"},{p:"b",t:"c",ipa:"/b/"},{p:"y",t:"c",ipa:"/iː/ ee"}],hint:"'a' says ay — magic e pattern. 'y' at the end says ee. Say: bay·by."},
  {word:"came",target:"came",sentence:"Sanjay came to school late as he missed his bus.",meaning:"Arrived at a place; past tense of come.",phonemes:[{p:"c",t:"c",ipa:"/k/"},{p:"a",t:"v",ipa:"/eɪ/ ay"},{p:"m",t:"c",ipa:"/m/"},{p:"e",t:"s",ipa:"silent"}],hint:"'a' says ay — the magic e at the end makes it say its name. c·ay·m."},
  {word:"sister",target:"sister",sentence:"My sister is licking her ice cream.",meaning:"A girl or woman who has the same parents as you.",phonemes:[{p:"s",t:"c",ipa:"/s/"},{p:"i",t:"v",ipa:"/ɪ/ ih"},{p:"st",t:"b",ipa:"/st/"},{p:"er",t:"d",ipa:"/ər/ er"}],hint:"'st' is a blend. 'er' at the end sounds like ur — like in butter."},
  {word:"Mother",target:"Mother",sentence:"Mother placed eight candles on the birthday cake.",meaning:"A female parent.",phonemes:[{p:"M",t:"c",ipa:"/m/"},{p:"o",t:"v",ipa:"/ʌ/ uh"},{p:"th",t:"d",ipa:"/ð/ th"},{p:"er",t:"d",ipa:"/ər/ er"}],hint:"'o' sounds like uh. 'th' makes the th sound. 'er' sounds like ur."},
  {word:"fuss",target:"fuss",sentence:"My aunts like to fuss over me whenever I visit them.",meaning:"To be overly worried or busy about small things.",phonemes:[{p:"f",t:"c",ipa:"/f/"},{p:"u",t:"v",ipa:"/ʌ/ uh"},{p:"ss",t:"c",ipa:"/s/"}],hint:"Double 'ss' after a short vowel — just one s sound. Short 'u' says uh."},
  {word:"Father",target:"Father",sentence:"Father wore a sweater last night as he felt cold.",meaning:"A male parent.",phonemes:[{p:"F",t:"c",ipa:"/f/"},{p:"a",t:"v",ipa:"/ɑː/ ah"},{p:"th",t:"d",ipa:"/ð/ th"},{p:"er",t:"d",ipa:"/ər/ er"}],hint:"'a' here sounds like ah. 'th' makes the th sound. 'er' sounds like ur."},
  {word:"nonsense",target:"nonsense",sentence:"James is tired of the nonsense from his little cousin.",meaning:"Words or behaviour that are foolish or have no meaning.",phonemes:[{p:"n",t:"c",ipa:"/n/"},{p:"o",t:"v",ipa:"/ɒ/ o"},{p:"n",t:"c",ipa:"/n/"},{p:"s",t:"c",ipa:"/s/"},{p:"en",t:"d",ipa:"/ən/"},{p:"se",t:"s",ipa:"silent"}],hint:"Say it in parts: non·sense. The final 'se' is nearly silent."},
  {word:"home",target:"home",sentence:"The dog waggles its tail all the way home.",meaning:"The place where you live.",phonemes:[{p:"h",t:"c",ipa:"/h/"},{p:"o",t:"v",ipa:"/əʊ/ oh"},{p:"m",t:"c",ipa:"/m/"},{p:"e",t:"s",ipa:"silent"}],hint:"'o' says oh — magic e at the end makes the vowel say its name."},
  {word:"carried",target:"carried",sentence:"The strong wind carried the dry leaves into the pond.",meaning:"Held and moved something from one place to another.",phonemes:[{p:"c",t:"c",ipa:"/k/"},{p:"ar",t:"d",ipa:"/æ/ a"},{p:"r",t:"c",ipa:"/r/"},{p:"ied",t:"d",ipa:"/iːd/ eed"}],hint:"'y' changes to 'ied' in past tense. Carry → carried."},
 ]},
 {week:5,words:[
  {word:"mooncake",target:"mooncake",sentence:"The man is sitting at the bus stop, enjoying a mooncake.",meaning:"A traditional round pastry eaten during the Mid-Autumn Festival.",phonemes:[{p:"m",t:"c",ipa:"/m/"},{p:"oo",t:"d",ipa:"/uː/ oo"},{p:"n",t:"c",ipa:"/n/"},{p:"c",t:"c",ipa:"/k/"},{p:"a",t:"v",ipa:"/eɪ/ ay"},{p:"k",t:"c",ipa:"/k/"},{p:"e",t:"s",ipa:"silent"}],hint:"Two words joined: moon + cake. 'oo' says oo. 'a' says ay — magic e rule."},
  {word:"meat",target:"meat",sentence:"My father goes to the market to buy some meat for tonight's barbeque.",meaning:"The flesh of an animal used as food.",phonemes:[{p:"m",t:"c",ipa:"/m/"},{p:"ea",t:"d",ipa:"/iː/ ee"},{p:"t",t:"c",ipa:"/t/"}],hint:"'ea' makes a long ee sound — like in eat and sea."},
  {word:"delicious",target:"delicious",sentence:"Melinda finished her delicious egg tart in three mouthfuls.",meaning:"Having a very pleasant taste or smell.",phonemes:[{p:"d",t:"c",ipa:"/d/"},{p:"e",t:"v",ipa:"/ɪ/ ih"},{p:"l",t:"c",ipa:"/l/"},{p:"i",t:"v",ipa:"/ɪ/ ih"},{p:"c",t:"c",ipa:"/ʃ/ sh"},{p:"ious",t:"d",ipa:"/əs/ us"}],hint:"'c' before 'i' makes a sh sound here. Say: de·li·cious. The 'ious' ending says us."},
  {word:"tiger",target:"tiger",sentence:"There have been reports lately of a tiger seen in the village.",meaning:"A large wild cat with orange and black stripes.",phonemes:[{p:"t",t:"c",ipa:"/t/"},{p:"i",t:"v",ipa:"/aɪ/ eye"},{p:"g",t:"c",ipa:"/g/"},{p:"er",t:"d",ipa:"/ər/ er"}],hint:"'i' says eye — magic e pattern. 'er' sounds like ur."},
  {word:"rabbit",target:"rabbit",sentence:"My pet rabbit loves to nibble on cabbage leaves.",meaning:"A small furry animal with long ears that hops.",phonemes:[{p:"r",t:"c",ipa:"/r/"},{p:"a",t:"v",ipa:"/æ/ a"},{p:"bb",t:"c",ipa:"/b/"},{p:"it",t:"d",ipa:"/ɪt/"}],hint:"Double 'bb' gives a short vowel. Short 'a' says a. Say: rab·bit."},
  {word:"inside",target:"inside",sentence:"We stepped inside the restaurant to look at the menu.",meaning:"Into or within a building or space.",phonemes:[{p:"in",t:"b",ipa:"/ɪn/"},{p:"s",t:"c",ipa:"/s/"},{p:"i",t:"v",ipa:"/aɪ/ eye"},{p:"d",t:"c",ipa:"/d/"},{p:"e",t:"s",ipa:"silent"}],hint:"Two parts: in + side. 'i' in side says eye — magic e rule."},
  {word:"hand",target:"hand",sentence:"I injured my left hand when I fell down the stairs.",meaning:"The part of your body at the end of your arm, with fingers.",phonemes:[{p:"h",t:"c",ipa:"/h/"},{p:"a",t:"v",ipa:"/æ/ a"},{p:"nd",t:"b",ipa:"/nd/"}],hint:"Short 'a' says a. 'nd' is a blend at the end. Say: h·a·nd."},
  {word:"lantern",target:"lantern",sentence:"I made a lantern out of red packets for Art today.",meaning:"A light in a case — often carried or hung as decoration.",phonemes:[{p:"l",t:"c",ipa:"/l/"},{p:"a",t:"v",ipa:"/æ/ a"},{p:"n",t:"c",ipa:"/n/"},{p:"t",t:"c",ipa:"/t/"},{p:"ern",t:"d",ipa:"/ərn/ ern"}],hint:"'ern' at the end sounds like urn. Say it in parts: lan·tern."},
  {word:"gone",target:"gone",sentence:"We need to protect our precious wildlife before they are gone.",meaning:"No longer here; having left or disappeared.",phonemes:[{p:"g",t:"c",ipa:"/g/"},{p:"o",t:"v",ipa:"/ɒ/ o"},{p:"n",t:"c",ipa:"/n/"},{p:"e",t:"s",ipa:"silent"}],hint:"'o' says short o here — the 'e' does NOT make it say its name. A tricky word!"},
  {word:"money",target:"money",sentence:"I do not like to waste money on toys.",meaning:"Coins and notes used to buy things.",phonemes:[{p:"m",t:"c",ipa:"/m/"},{p:"o",t:"v",ipa:"/ʌ/ uh"},{p:"n",t:"c",ipa:"/n/"},{p:"ey",t:"d",ipa:"/iː/ ee"}],hint:"'o' sounds like uh — as in monkey. 'ey' at the end says ee."},
 ]},
 {week:6,words:[
  {word:"price",target:"price",sentence:"Mei Lin asked the shopkeeper for the price of the lantern.",meaning:"The amount of money you need to pay for something.",phonemes:[{p:"pr",t:"b",ipa:"/pr/"},{p:"i",t:"v",ipa:"/aɪ/ eye"},{p:"c",t:"c",ipa:"/s/"},{p:"e",t:"s",ipa:"silent"}],hint:"'pr' is a blend. 'i' says eye — magic e rule. 'c' before 'e' makes an s sound."},

  {word:"dumplings",target:"dumplings",sentence:"Mother made the dumplings in the morning.",meaning:"Small balls of dough cooked by boiling or steaming, often with a filling.",phonemes:[{p:"d",t:"c",ipa:"/d/"},{p:"u",t:"v",ipa:"/ʌ/ uh"},{p:"mp",t:"b",ipa:"/mp/"},{p:"l",t:"c",ipa:"/l/"},{p:"ing",t:"d",ipa:"/ɪŋ/"},{p:"s",t:"c",ipa:"/z/"}],hint:"'mp' is a blend. 'ump' rhymes with jump. Say: dump·lings."},

const TCLS={v:"v",c:"c",b:"b",d:"d",s:"s"};
const TNAME={v:"Vowel",c:"Consonant",b:"Blend",d:"Digraph",s:"Silent"};

let ST={scores:{}};

async function loadState(){
  try{
    const r=await window.storage.get("spStarsT3");
    if(r&&r.value)ST=JSON.parse(r.value);
    if(!ST.scores)ST.scores={};
  }catch(e){ST={scores:{}};}
  loadState();
}

async function saveState(){
  try{await window.storage.set("spStarsT3",JSON.stringify(ST));}catch(e){}
}

let W=null,cur=0,practiceScores=[],mode="learn",inp="",fb="",tries=0;
let testAns=[],testDone=false;

let voice=null;
function initVoice(){
  const vs=speechSynthesis.getVoices();
  if(!vs.length)return;
  voice=vs.find(v=>v.name==="Samantha")||vs.find(v=>v.name.includes("Samantha"))||vs.find(v=>v.lang==="en-US"&&!/male/i.test(v.name))||vs.find(v=>v.lang.startsWith("en"));
}
speechSynthesis.onvoiceschanged=initVoice;
setTimeout(initVoice,500);

function speak(txt,rate){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  if(voice){u.voice=voice;u.lang=voice.lang;}else u.lang="en-US";
  u.rate=rate||0.78;u.pitch=1.45;
  speechSynthesis.speak(u);
}

function speakTestQ(i){
  const w=W.words[i];
  speechSynthesis.cancel();
  document.querySelectorAll(".test-spk").forEach(b=>b.classList.remove("playing"));
  const btn=document.getElementById("tspk"+i);
  if(btn)btn.classList.add("playing");
  const u1=new SpeechSynthesisUtterance(w.word);
  if(voice){u1.voice=voice;u1.lang=voice.lang;}
  u1.rate=0.65;u1.pitch=1.45;
  u1.onend=()=>{
    setTimeout(()=>{
      const u2=new SpeechSynthesisUtterance(w.word);
      if(voice){u2.voice=voice;u2.lang=voice.lang;}
      u2.rate=0.58;u2.pitch=1.45;
      u2.onend=()=>{if(btn)btn.classList.remove("playing");};
      speechSynthesis.speak(u2);
    },400);
  };
  speechSynthesis.speak(u1);
}

function spkSVG(s){s=s||20;return'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';}

function starRow(n,tot){
  var s="";for(var i=0;i<tot;i++)s+=i<n?'<span style="color:#f5c842">★</span>':'<span style="color:#ddd">★</span>';
  return s;
}

function hlSent(s,t){return s.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),function(m){return'<span class="tw">'+m+'</span>';});}
function blankSent(s,t){return s.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');}
function setHTML(h){document.getElementById("root").innerHTML=h;}

function showHome(){
  speechSynthesis.cancel();W=null;
  var cards=WEEKS.map(function(wk){
    var sc=ST.scores[wk.week];
    var done=sc&&sc.stars===wk.words.length;
    var cls="week-card has-words"+(done?" perfect":" active");
    var sh=sc?'<div style="font-size:10px;">'+starRow(sc.stars,sc.total)+'</div>':'<span style="font-size:10px;color:#ccc">Not started</span>';
    var s2=sc?sc.stars+"/"+sc.total:"";
    return'<div class="'+cls+'" onclick="startWeek('+wk.week+')"><div class="wk-label">Week '+wk.week+'</div><div class="wk-stars">'+sh+'</div><div class="wk-score">'+s2+'</div></div>';
  }).join("");
  var nx=WEEKS.find(function(w){return!ST.scores[w.week]||ST.scores[w.week].stars<w.words.length;});
  var bw=nx?nx.week:WEEKS[0].week;
  var bl=nx?(ST.scores[nx.week]?"Try Week "+nx.week+" again →":"Start Week "+nx.week+" →"):"Practice again!";
  setHTML('<div class="trophy-screen"><h2>My Spelling Stars — Term 3</h2><p class="tsub">Get all 10 stars in a week to earn your chocolate! 🍫</p><div class="weeks-grid">'+cards+'</div><button class="start-btn" onclick="startWeek('+bw+')">'+bl+'</button></div>');
}

function startWeek(wkNum){
  W=WEEKS.find(function(w){return w.week===wkNum;});
  if(!W)return;
  cur=0;practiceScores=[];mode="learn";inp="";fb="";tries=0;
  testAns=W.words.map(function(){return"";});testDone=false;
  showPractice();
}

function showPractice(){
  setHTML(
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem;">'+
    '<button class="act" style="font-size:12px;padding:6px 12px;" onclick="showHome()">← Home</button>'+
    '<span style="font-size:12px;color:#888;font-weight:600;">Week '+W.week+'</span>'+
    '<span id="hstars" style="font-size:13px;">'+starRow(0,W.words.length)+'</span>'+
    '</div><div class="pips" id="pips"></div><div id="main"></div>'
  );
  drawPips();drawMain();
}

function drawPips(){
  var el=document.getElementById("pips");if(!el)return;
  el.innerHTML=W.words.map(function(_,i){var c="pip";if(practiceScores[i]!==undefined)c+=" done";else if(i===cur)c+=" cur";return'<div class="'+c+'"></div>';}).join("");
}

function updStars(){var el=document.getElementById("hstars");if(el)el.innerHTML=starRow(practiceScores.filter(Boolean).length,W.words.length);}

function drawMain(){
  var el=document.getElementById("main");if(!el)return;
  if(mode==="learn")el.innerHTML=learnHTML();
  else if(mode==="spell")el.innerHTML=spellHTML();
  else if(mode==="test")el.innerHTML=testHTML();
  else if(mode==="score")el.innerHTML=scoreHTML();
  if(mode==="spell"&&!fb){var si=document.getElementById("si");if(si){si.focus();si.setSelectionRange(si.value.length,si.value.length);}}
}

function learnHTML(){
  var w=W.words[cur];
  var phHTML=w.phonemes.map(function(ph){return'<div class="ph '+TCLS[ph.t]+'">'+ph.p+'<span class="ipa">'+ph.ipa+'</span><span class="ptype">'+TNAME[ph.t]+'</span></div>';}).join("");
  return'<div class="card">'+
    '<div class="wnum">Word '+(cur+1)+' of '+W.words.length+'</div>'+
    '<div class="tabs"><div class="tab on">Learn it</div><div class="tab" onclick="setMode(\'spell\')">Spell it</div><div class="tab" onclick="setMode(\'test\')">Test</div></div>'+
    '<div class="sent-row"><button class="spk" onclick="speak(W.words[cur].sentence,0.78)">'+spkSVG(20)+'</button><div class="sent-text">'+hlSent(w.sentence,w.target)+'</div></div>'+
    '<div class="mean"><b>Meaning:</b> '+w.meaning+'</div>'+
    '<div class="plabel">Jolly Phonics breakdown</div><div class="ph-row">'+phHTML+'</div>'+
    '<div class="tip">💡 '+w.hint+'</div>'+
    '<div class="leg"><div class="li"><div class="ld" style="background:#AFA9EC"></div>Vowel</div><div class="li"><div class="ld" style="background:#5DCAA5"></div>Consonant</div><div class="li"><div class="ld" style="background:#F0997B"></div>Blend</div><div class="li"><div class="ld" style="background:#FAC775"></div>Digraph</div><div class="li"><div class="ld" style="background:#ccc"></div>Silent</div></div>'+
    '<div class="btn-row"><button class="act pri" onclick="setMode(\'spell\')">Spell it →</button>'+
    (cur<W.words.length-1?'<button class="act" onclick="nextWord()">Next word →</button>':'')+
    (cur>0?'<button class="act" onclick="goBack()">← Back</button>':'')+
    '<button class="act" onclick="setMode(\'test\')" style="margin-left:auto;border-color:#534AB7;color:#534AB7;">Test 📝</button>'+
    '</div></div>';
}

function spellHTML(){
  var w=W.words[cur];
  var we=w.word.replace(/'/g,"\\'");
  var se=w.sentence.replace(/'/g,"\\'").replace(/"/g,"&quot;");
  var ic="spell-input"+(fb==="good"?" correct":fb==="bad"?" wrong":"");
  return'<div class="card">'+
    '<div class="wnum">Word '+(cur+1)+' of '+W.words.length+'</div>'+
    '<div class="tabs"><div class="tab" onclick="setMode(\'learn\')">Learn it</div><div class="tab on">Spell it</div><div class="tab" onclick="setMode(\'test\')">Test</div></div>'+
    '<div class="sent-row" style="margin-bottom:1.1rem;"><button class="spk" onclick="speak(\''+se+'\',0.78)">'+spkSVG(20)+'</button><div class="sent-text">'+blankSent(w.sentence,w.target)+'</div></div>'+
    '<button class="spell-action-btn" onclick="speak(\''+we+'\',0.62)"><div class="spk-circle">'+spkSVG(18)+'</div><div><div class="btn-label">Spell it now</div><div class="btn-sub">Tap to hear the word, then type it below</div></div></button>'+
    '<input class="'+ic+'" id="si" type="text" placeholder="Type the word here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="'+inp.replace(/"/g,"&quot;")+'" oninput="handleInp(this.value)" onkeydown="handleKey(event)" '+(fb?"disabled":"")+' dir="ltr"/>'+
    '<div class="btn-row">'+
    (!fb?'<button class="act pri" onclick="chk()">Check ✓</button>':'')+
    (fb==="good"&&cur<W.words.length-1?'<button class="act suc" onclick="next()">Next word →</button>':'')+
    (fb==="good"&&cur===W.words.length-1?'<button class="act suc" onclick="setMode(\'test\')">Take the test! 📝</button>':'')+
    (fb==="bad"?'<button class="act" onclick="retry()">Try again</button>':'')+
    (fb==="bad"&&tries>=2?'<button class="act" onclick="setMode(\'learn\')">Go back to Learn it</button>':'')+
    '<button class="act" onclick="setMode(\'test\')" style="margin-left:auto;border-color:#534AB7;color:#534AB7;">Test 📝</button>'+
    '</div>'+
    (fb==="good"?'<div class="fb good pop">⭐ Brilliant! <b>'+w.word+'</b> is correct!</div>':'')+
    (fb==="bad"?'<div class="fb bad">Not quite — tap the speaker to hear the word again, then try!</div>':'')+
    '</div>';
}

function testHTML(){
  var rows=W.words.map(function(w,i){
    var ans=testAns[i]||"";
    var ic="test-input";
    var hint="";
    if(testDone){var ok=ans.trim().toLowerCase()===w.word.toLowerCase();ic+=ok?" t-ok":" t-bad";if(!ok)hint='<span class="test-correct-ans">'+w.word+'</span>';}
    return'<div class="test-row"><span class="test-num">'+(i+1)+'.</span>'+
      '<button class="test-spk" id="tspk'+i+'" onclick="speakTestQ('+i+')">'+spkSVG(20)+'</button>'+
      '<input class="'+ic+'" type="text" placeholder="Type answer…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="'+ans.replace(/"/g,"&quot;")+'" oninput="handleTestInp('+i+',this.value)" onkeydown="handleTestKey(event,'+i+')" '+(testDone?"disabled":"")+' dir="ltr" id="tinput'+i+'"/>'+hint+'</div>';
  }).join("");
  var correct=0;
  if(testDone)correct=testAns.filter(function(a,i){return a.trim().toLowerCase()===W.words[i].word.toLowerCase();}).length;
  var perfect=testDone&&correct===W.words.length;
  return'<div class="test-card">'+
    '<div class="test-title">Week '+W.week+' Test 📝</div>'+
    '<div class="test-sub">Tap '+spkSVG(14)+' to hear the word twice, then type your answer.</div>'+
    rows+
    '<div class="test-actions">'+
    (!testDone
      ?'<button class="act pri" onclick="submitTest()">Submit answers ✓</button><button class="act" onclick="playAll()">▶ Play all</button>'
      :'<button class="act'+(perfect?"":" warn")+'" onclick="retryTest()">'+(perfect?"Try again ↺":"Try test again →")+'</button><button class="act pri" onclick="finishWeek()">See my stars! ⭐</button>')+
    '<button class="act" onclick="setMode(\'learn\')" style="margin-left:auto;">← Back to practice</button>'+
    '</div>'+
    (testDone?'<div class="fb '+(perfect?"good":"bad")+'" style="margin-top:1rem;">'+(perfect?"⭐ Perfect! You spelled all "+W.words.length+" words correctly!":"You got "+correct+" out of "+W.words.length+" correct. Check the answers in red, then try again!")+'</div>':'')+
    '</div>';
}

function handleTestInp(i,v){testAns[i]=v;}
function handleTestKey(e,i){if(e.key==="Enter"){var nx=document.getElementById("tinput"+(i+1));if(nx)nx.focus();else submitTest();}}
function submitTest(){testDone=true;speechSynthesis.cancel();drawMain();}
function retryTest(){testAns=W.words.map(function(){return"";});testDone=false;drawMain();}

var playTimer=null;
function playAll(){
  speechSynthesis.cancel();if(playTimer)clearTimeout(playTimer);
  var i=0;
  function nx(){
    if(i>=W.words.length)return;
    speakTestQ(i);
    var el=document.getElementById("tinput"+i);if(el)el.focus();
    var dur=W.words[i].word.length*300+2200;
    playTimer=setTimeout(function(){i++;nx();},dur);
  }nx();
}

function finishWeek(){
  var correct=testAns.filter(function(a,i){return a.trim().toLowerCase()===W.words[i].word.toLowerCase();}).length;
  ST.scores[W.week]={stars:correct,total:W.words.length};saveState();
  mode="score";drawMain();
}

function scoreHTML(){
  var sc=ST.scores[W.week];
  var stars=sc?sc.stars:0,total=sc?sc.total:W.words.length,perfect=stars===total;
  return'<div class="card sc">'+
    '<div class="sc-stars pop">'+starRow(stars,total)+'</div>'+
    '<div class="sc-num">'+stars+' / '+total+'</div>'+
    '<h2>'+(perfect?"Perfect score! Amazing work!":"Keep going — you can get all 10!")+'</h2>'+
    '<p>'+(perfect?"You got every single word right this week!":"You got "+stars+" out of "+total+" correct. Try the test again to collect all your stars!")+'</p>'+
    (perfect?'<div class="choc-box"><div class="choc-icon">🍫</div>You earned your chocolate this week!<br><span style="font-size:13px;font-weight:400;color:#9a7020;">Go claim your reward — you deserve it!</span></div>':'')+
    '<div class="sc-btns">'+
    '<button class="act'+(perfect?"":" warn")+'" onclick="setMode(\'test\')">'+(perfect?"Do test again ↺":"Try test again →")+'</button>'+
    '<button class="act" onclick="setMode(\'learn\')">Back to practice</button>'+
    '<button class="act pri" onclick="showHome()">Back to all weeks</button>'+
    '</div></div>';
}

function setMode(m){speechSynthesis.cancel();mode=m;inp="";fb="";drawMain();}
function handleInp(v){inp=v;}
function handleKey(e){if(e.key==="Enter")chk();}
function chk(){
  var w=W.words[cur];
  if(inp.trim().toLowerCase()===w.word.toLowerCase()){fb="good";practiceScores[cur]=true;updStars();setTimeout(function(){speak(w.word,0.72);},250);}
  else{fb="bad";tries++;if(practiceScores[cur]===undefined)practiceScores[cur]=false;}
  drawMain();
}
function retry(){fb="";inp="";drawMain();}
function next(){cur++;mode="learn";inp="";fb="";tries=0;drawPips();drawMain();}
function nextWord(){cur++;mode="learn";inp="";fb="";tries=0;drawPips();drawMain();}
function goBack(){if(cur>0){cur--;mode="learn";inp="";fb="";tries=0;drawPips();drawMain();}}

showHome();
</script>
</body>
</html>
